[project]
name = "medtracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marine", email = "" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
medtracker = "medtracker:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]
